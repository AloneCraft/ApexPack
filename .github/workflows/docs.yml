name: GitHub Pages documentation

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    env:
      DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Run the quickstart
        run: dotnet run --configuration Release --file docs/examples/QuickStart.cs
      - name: Build documentation
        run: |
          dotnet tool install docfx --version 2.81.0 --tool-path "$RUNNER_TEMP/docfx"
          "$RUNNER_TEMP/docfx/docfx" build docs/docfx.json --warningsAsErrors
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
